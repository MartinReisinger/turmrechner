name: Build and deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: turmrechner-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: vps-runner
    timeout-minutes: 45
    container:
      image: local/runner-env
    env:
      DEPLOY_COMMIT: ${{ github.sha }}
      IMAGE: git.martindev.at/martinreisinger/turmrechner
    steps:
      - name: Checkout exact commit
        env:
          CHECKOUT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          git init --quiet .
          git remote add origin "https://x-access-token:${CHECKOUT_TOKEN}@git.martindev.at/MartinReisinger/turmrechner.git"
          git fetch --quiet --depth=1 origin "$DEPLOY_COMMIT"
          git checkout --quiet --detach FETCH_HEAD

      - name: Build and push
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -eu
          printf '%s\n' "$REGISTRY_TOKEN" | docker login \
            -u martinreisinger --password-stdin git.martindev.at
          DOCKER_BUILDKIT=1 BUILDKIT_PROGRESS=plain docker build \
            --label "org.opencontainers.image.revision=$DEPLOY_COMMIT" \
            -t "$IMAGE:$DEPLOY_COMMIT" -t "$IMAGE:latest" .
          docker push "$IMAGE:$DEPLOY_COMMIT"
          docker push "$IMAGE:latest"

      - name: Deploy exact image
        run: |
          set -eu
          deploy_dir=/home/deploy/turmrechner
          test -d "$deploy_dir"
          install -m 0644 deploy/vps/compose.yml "$deploy_dir/compose.yml"
          printf 'DEPLOY_COMMIT=%s\n' "$DEPLOY_COMMIT" > "$deploy_dir/.env.next"
          chmod 600 "$deploy_dir/.env.next"
          cd "$deploy_dir"
          docker compose --env-file .env.next config -q
          docker compose --env-file .env.next pull
          docker compose --env-file .env.next up -d --wait --wait-timeout 120
          mv .env.next .env
          docker compose ps
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3016/
