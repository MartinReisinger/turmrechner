<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#090a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Turmrechnen</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<style>
:root{
  color-scheme:dark;
  --bg:#090a0c;
  --text:#f4f5f6;
  --muted:#777d85;
  --soft:#b9bec4;
  --key:#15181c;
  --keyDown:#20242a;
  --good:#83dc8d;
  --bad:#ff7b73;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif
}
body{position:fixed;inset:0;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;border:0;color:inherit;background:none}
.app{
  width:min(520px,100%);height:100dvh;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 8px) 14px calc(env(safe-area-inset-bottom) + 8px);
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;overflow:hidden
}
header{display:flex;align-items:center;justify-content:space-between;min-height:38px}
.brand{font-size:20px;font-weight:790;letter-spacing:-.03em}
.sub{font-size:11px;color:var(--muted);margin-top:1px}
.reset{
  width:38px;height:38px;border-radius:12px;background:#121418;
  display:grid;place-items:center;font-size:19px
}
main{min-height:0;overflow:hidden;position:relative}
.screen{display:none;width:100%;height:100%;min-height:0}
.screen.active{display:grid}

#seedScreen{place-items:center;text-align:center}
.seedLabel{
  color:var(--muted);font-size:12px;font-weight:760;letter-spacing:.1em;text-transform:uppercase
}
.seedValue{
  margin-top:10px;min-height:58px;font-size:48px;font-weight:800;letter-spacing:-.045em;
  font-variant-numeric:tabular-nums
}
.cursor{
  width:34px;height:3px;border-radius:4px;background:#f1f2f3;margin:4px auto 0;
  animation:pulse 1.05s ease-in-out infinite
}
.seedHint{margin-top:12px;color:var(--muted);font-size:13px}

#gameScreen{
  grid-template-rows:auto minmax(0,1fr) auto;
  gap:5px
}
.statusRow{display:flex;align-items:center;justify-content:space-between;padding:0 2px}
.step{font-size:17px;font-weight:780}
.counter{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.progress{height:3px;background:#17191d;border-radius:99px;overflow:hidden;margin-top:4px}
.progressFill{height:100%;background:#e8eaec;width:0;transition:width .18s ease}

.towerViewport{
  min-height:0;
  overflow:hidden;
  position:relative;
  display:grid;
  grid-template-columns:minmax(0,1fr) 58px;
  align-items:end;
  padding:6px 0 4px
}
.numberScroller{
  min-width:0;
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:none;
  overscroll-behavior-x:contain;
  -webkit-overflow-scrolling:touch;

  /* iOS-wheel-like movement */
  scroll-snap-type:x mandatory;
  scroll-behavior:smooth
}

/* No fading at all until the arithmetic view has actually started scrolling. */
.numberScroller.hasScrolled{
  -webkit-mask-image:linear-gradient(
    to right,
    rgba(0,0,0,.35) 0%,
    #000 10%,
    #000 82%,
    rgba(0,0,0,.55) 94%,
    rgba(0,0,0,.25) 100%
  );
  mask-image:linear-gradient(
    to right,
    rgba(0,0,0,.35) 0%,
    #000 10%,
    #000 82%,
    rgba(0,0,0,.55) 94%,
    rgba(0,0,0,.25) 100%
  )
}
.numberScroller::-webkit-scrollbar{display:none}
.numberScroller{
  position:relative;
}
.numberCanvas{
  width:max-content;
  min-width:100%;
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:5px;
  padding-left:50vw;
  padding-right:8px;
  font-family:"SF Mono","Roboto Mono",ui-monospace,Menlo,monospace;
  font-variant-numeric:tabular-nums;
  white-space:nowrap
}
.opsRail{
  width:58px;
  display:flex;
  flex-direction:column;
  align-items:stretch;
  gap:5px;
  font-family:"SF Mono","Roboto Mono",ui-monospace,Menlo,monospace;
  font-variant-numeric:tabular-nums
}
.towerRow{
  display:flex;
  justify-content:flex-end;
  align-items:end;
  min-height:38px;
  width:max-content
}
.numberWrap{
  display:flex;
  justify-content:flex-end;
  align-items:flex-end;
  min-width:max-content;
  flex-wrap:nowrap
}
.digitCol{
  width:37px;
  min-width:37px;
  flex:0 0 37px;
  height:42px;
  scroll-snap-align:center;
  scroll-snap-stop:always;
  position:relative;
  display:flex;
  align-items:flex-end;
  justify-content:center
}
.digit{
  font-size:28px;line-height:33px;font-weight:720
}
.carry{
  position:absolute;
  top:-21px;
  left:-7px;
  min-width:18px;
  text-align:center;
  font-size:12px;
  line-height:15px;
  color:#a9afb6;
  font-weight:720;
  z-index:2
}
.carry.active{
  width:18px;
  height:15px;
}
.carry.active::after{
  content:"";
  position:absolute;
  left:1px;
  right:1px;
  bottom:1px;
  height:2px;
  border-radius:3px;
  background:#f1f2f3;
  animation:pulse 1.05s ease-in-out infinite
}
.op{
  font-size:22px;
  line-height:33px;
  color:#c5c9ce;
  text-align:right;
  padding-right:4px;
  font-weight:700
}
.opCell{
  height:38px;
  min-height:38px;
  display:flex;
  align-items:flex-end;
  justify-content:flex-end;
  padding-right:4px;
  font-size:22px;
  line-height:33px;
  color:#c5c9ce;
  font-weight:700;
  white-space:nowrap
}
.opCell.resultOp{height:45px;min-height:45px}
.opRule{
  height:1.5px;
  margin:0 0 0 0;
}
.resultRow .digitCol{height:45px}
.resultRow .digit{font-size:29px}
.resultCell{
  width:37px;
  min-width:37px;
  flex:0 0 37px;
  height:38px;
  scroll-snap-align:center;
  scroll-snap-stop:always;
  position:relative;
  display:flex;
  align-items:flex-end;
  justify-content:center
}
.resultCell.active::after{
  content:"";position:absolute;left:7px;right:7px;bottom:0;height:3px;border-radius:3px;
  background:#f1f2f3;animation:pulse 1.05s ease-in-out infinite
}
.rowRule{
  height:1.5px;
  background:#dfe2e5;
  border-radius:2px;
  margin-left:18%;
  margin-right:0
}
.mutedRow{opacity:.52}
.currentRow{opacity:1}
.prompt{
  min-height:27px;text-align:center;color:var(--muted);font-size:12px;line-height:1.25;
  padding-top:3px
}
.feedback{
  height:17px;text-align:center;font-size:12px;font-weight:700;color:var(--muted)
}
.feedback.bad{color:var(--bad)}
.feedback.good{color:var(--good)}

#doneScreen{place-items:center;text-align:center}
.doneMark{
  width:54px;height:54px;border-radius:18px;background:#172119;color:var(--good);
  display:grid;place-items:center;margin:0 auto 13px;font-size:28px;font-weight:800
}
.doneTitle{font-size:25px;font-weight:800;letter-spacing:-.03em}
.doneText{font-size:13px;color:var(--muted);margin:7px 0 12px}
.doneSeed{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums}

.bottom{
  display:grid;gap:7px
}
.primary{
  width:100%;height:47px;border-radius:14px;background:#eef0f2;color:#0b0c0e;
  font-size:16px;font-weight:820
}
.primary.hidden{display:none}

.keypad{
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px
}
.key{
  height:48px;border-radius:13px;background:var(--key);
  font-size:22px;font-weight:690
}
.key{
  position:relative;
  overflow:hidden;
}
.key:active{transform:scale(.975);background:var(--keyDown)}
.key.back{font-size:18px;color:var(--soft)}
.key.action{
  background:#eef0f2;color:#0b0c0e;font-size:13px;font-weight:820
}
.key.action.disabled,.key.back.disabled{opacity:.28;pointer-events:none}

/* iOS haptic workaround:
   the finger directly taps a native switch covering the whole key.
   It remains invisible and never opens the keyboard. */
.hapticSwitch{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  opacity:0;
  z-index:3;
  cursor:pointer;
  appearance:auto;
  -webkit-appearance:auto;
}
.keyLabel{
  position:relative;
  z-index:1;
  pointer-events:none;
}

@keyframes pulse{
  0%,100%{opacity:.28;transform:scaleX(.72)}
  50%{opacity:1;transform:scaleX(1)}
}
.shake{animation:shake .22s linear}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-5px)}
  75%{transform:translateX(5px)}
}
@media(max-height:700px){
  .app{padding-top:calc(env(safe-area-inset-top) + 5px);padding-bottom:calc(env(safe-area-inset-bottom) + 5px);gap:5px}
  header{min-height:34px}
  .reset{width:34px;height:34px}
  .key{height:43px}
  .tower{gap:3px}
  .towerRow{min-height:34px}
  .digitCol{height:38px}
  .digit{font-size:25px;line-height:30px}
  .op{font-size:20px;line-height:30px}
}
@media(max-width:390px){
  .digitCol,.resultCell{width:33px;min-width:33px}
  .digit,.resultRow .digit{font-size:25px}
  .towerViewport{grid-template-columns:minmax(0,1fr) 52px}
  .opsRail{width:52px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="brand">Turmrechnen</div>
      <div class="sub">wie auf Papier</div>
    </div>
    <button class="reset" id="resetBtn">↻</button>
  </header>

  <main>
    <section class="screen active" id="seedScreen">
      <div>
        <div class="seedLabel">Startzahl</div>
        <div class="seedValue" id="seedValue">0</div>
        <div class="cursor"></div>
        <div class="seedHint">Mit der Tastatur unten eingeben</div>
      </div>
    </section>

    <section class="screen" id="gameScreen">
      <div>
        <div class="statusRow">
          <div class="step" id="stepLabel">× 2</div>
          <div class="counter" id="counter">1 / 16</div>
        </div>
        <div class="progress"><div class="progressFill" id="progressFill"></div></div>
      </div>

      <div class="towerViewport">
        <div class="numberScroller" id="numberScroller">
          <div class="numberCanvas" id="tower"></div>
        </div>
        <div class="opsRail" id="opsRail"></div>
      </div>

      <div>
        <div class="prompt" id="prompt"></div>
        <div class="feedback" id="feedback"></div>
      </div>
    </section>

    <section class="screen" id="doneScreen">
      <div>
        <div class="doneMark">✓</div>
        <div class="doneTitle">Turm fertig</div>
        <div class="doneText">Du bist wieder bei der Startzahl.</div>
        <div class="doneSeed" id="doneSeed"></div>
      </div>
    </section>
  </main>

  <div class="bottom">
    <button class="primary" id="startButton">Starten</button>

    <div class="keypad">
      <button class="key" data-key="1"><span class="keyLabel">1</span><input class="hapticSwitch" type="checkbox" switch aria-label="1"></button>
      <button class="key" data-key="2"><span class="keyLabel">2</span><input class="hapticSwitch" type="checkbox" switch aria-label="2"></button>
      <button class="key" data-key="3"><span class="keyLabel">3</span><input class="hapticSwitch" type="checkbox" switch aria-label="3"></button>
      <button class="key" data-key="4"><span class="keyLabel">4</span><input class="hapticSwitch" type="checkbox" switch aria-label="4"></button>
      <button class="key" data-key="5"><span class="keyLabel">5</span><input class="hapticSwitch" type="checkbox" switch aria-label="5"></button>
      <button class="key" data-key="6"><span class="keyLabel">6</span><input class="hapticSwitch" type="checkbox" switch aria-label="6"></button>
      <button class="key" data-key="7"><span class="keyLabel">7</span><input class="hapticSwitch" type="checkbox" switch aria-label="7"></button>
      <button class="key" data-key="8"><span class="keyLabel">8</span><input class="hapticSwitch" type="checkbox" switch aria-label="8"></button>
      <button class="key" data-key="9"><span class="keyLabel">9</span><input class="hapticSwitch" type="checkbox" switch aria-label="9"></button>
      <button class="key back" data-key="back"><span class="keyLabel">⌫</span><input class="hapticSwitch" type="checkbox" switch aria-label="Löschen"></button>
      <button class="key" data-key="0"><span class="keyLabel">0</span><input class="hapticSwitch" type="checkbox" switch aria-label="0"></button>
      <button class="key action disabled" id="actionKey" data-key="action"><span class="keyLabel">Zufall</span><input class="hapticSwitch" type="checkbox" switch aria-label="Zufällige Startzahl"></button>
    </div>
  </div>
</div>

<script>
(() => {
  const STEPS = [
    ["mul",2],["mul",3],["mul",4],["mul",5],["mul",6],["mul",7],["mul",8],["mul",9],
    ["div",2],["div",3],["div",4],["div",5],["div",6],["div",7],["div",8],["div",9]
  ];

  const $ = id => document.getElementById(id);
  const screens = [$("seedScreen"),$("gameScreen"),$("doneScreen")];
  const tower = $("tower");
  const feedback = $("feedback");

  let mode = "seed";
  let seedText = "";
  let seed = 0n;
  let current = 0n;
  let stepIndex = 0;
  let task = null;
  let completedRows = [];

  function show(screen){
    screens.forEach(s=>s.classList.remove("active"));
    screen.classList.add("active");
  }

  function renderSeed(){
    $("seedValue").textContent = seedText || "0";
    $("startButton").classList.toggle("hidden", mode!=="seed");

    const backKey = document.querySelector(".key.back");
    const randomKey = $("actionKey");
    const enabled = mode === "seed";

    backKey.classList.toggle("disabled", !enabled);
    randomKey.classList.toggle("disabled", !enabled);
  }

  function randomSeed(){
    if(mode !== "seed") return;

    // Typical use is four digits, but occasionally produce 5–6 digit seeds.
    // Keep it strictly within 1000…999999 so the seed is always useful.
    const roll = Math.random();
    let min, max;

    if(roll < 0.70){
      min = 1000;
      max = 9999;
    }else if(roll < 0.90){
      min = 10000;
      max = 99999;
    }else{
      min = 100000;
      max = 999999;
    }

    seedText = String(Math.floor(Math.random() * (max - min + 1)) + min);
    renderSeed();
  }

  function start(){
    if(!seedText) return;
    seed = BigInt(seedText);
    current = seed;
    stepIndex = 0;
    const [firstType, firstN] = STEPS[0];
    completedRows = [{
      value: seed.toString(),
      op: firstType,
      n: firstN
    }];
    mode = "game";
    $("startButton").classList.add("hidden");
    $("actionKey").classList.add("disabled");
    document.querySelector(".key.back").classList.add("disabled");
    show($("gameScreen"));
    beginStep();
  }

  function beginStep(){
    const [type,n] = STEPS[stepIndex];
    task = type==="mul" ? makeMul(current,n) : makeDiv(current,n);

    const scroller = $("numberScroller");
    if(scroller) scroller.classList.remove("hasScrolled");

    $("stepLabel").textContent = `${type==="mul"?"×":"÷"} ${n}`;
    $("counter").textContent = `${stepIndex+1} / 16`;
    $("progressFill").style.width = `${stepIndex/16*100}%`;
    $("actionKey").classList.add("disabled");
    document.querySelector('.key.back').classList.add("disabled");
    feedback.textContent = "";
    renderTower();
  }

  function makeMul(value,n){
    const digits=value.toString().split("").map(Number);
    return {
      type:"mul",n,digits,index:digits.length-1,phase:"digit",carryIn:0,
      result:Array(digits.length).fill(""),
      carries:Array(digits.length).fill(""),
      finalCarry:""
    };
  }

  function makeDiv(value,n){
    const digits=value.toString().split("").map(Number);
    return {
      type:"div",n,digits,index:0,phase:"digit",remainderIn:0,
      result:Array(digits.length).fill(""),
      remainders:Array(digits.length).fill("")
    };
  }

  function expected(){
    if(task.type==="mul"){
      const total=task.digits[task.index]*task.n+task.carryIn;
      return {digit:total%10,extra:Math.floor(total/10)};
    }
    const combined=task.remainderIn*10+task.digits[task.index];
    return {digit:Math.floor(combined/task.n),extra:combined%task.n};
  }

  function enterDigit(d){
    if(mode==="seed"){
      if(seedText.length<6){
        if(seedText==="0") seedText="";
        seedText+=String(d);
        renderSeed();
      }
      return;
    }
    if(mode!=="game") return;

    const exp=expected();
    const wanted=task.phase==="digit"?exp.digit:exp.extra;

    if(d!==wanted){
      feedback.textContent=task.phase==="digit"
        ? "Ziffer stimmt noch nicht."
        : task.type==="mul" ? "Übertrag stimmt noch nicht." : "Rest stimmt noch nicht.";
      feedback.className="feedback bad";
      tower.classList.remove("shake"); void tower.offsetWidth; tower.classList.add("shake");
      if(navigator.vibrate) navigator.vibrate(35);
      return;
    }

    feedback.textContent="";
    feedback.className="feedback";

    if(task.phase==="digit"){
      task.result[task.index]=String(d);
      task.phase="extra";
      renderTower();
      return;
    }

    if(task.type==="mul"){
      task.carries[task.index]=String(d);
      task.carryIn=d;
      task.index--;

      if(task.index<0){
        task.finalCarry=task.carryIn?String(task.carryIn):"";
        finishStep();
        return;
      }
    } else {
      task.remainders[task.index]=String(d);
      task.remainderIn=d;
      task.index++;

      if(task.index>=task.digits.length){
        if(task.remainderIn!==0){
          feedback.textContent="Rest muss am Ende 0 sein.";
          feedback.className="feedback bad";
          return;
        }
        finishStep();
        return;
      }
    }

    task.phase="digit";
    renderTower();
  }

  function finishStep(){
    let out;
    if(task.type==="mul"){
      out=(task.finalCarry+task.result.join("")).replace(/^0+(?=\d)/,"");
    }else{
      out=task.result.join("").replace(/^0+(?=\d)/,"")||"0";
    }

    current=BigInt(out);
    stepIndex++;

    if(stepIndex>=STEPS.length){
      completedRows.push({value:out,op:null,n:null});
      $("progressFill").style.width="100%";
      $("doneSeed").textContent=seed.toString();
      mode="done";
      show($("doneScreen"));
      return;
    }

    const [nextType,nextN]=STEPS[stepIndex];
    completedRows.push({
      value:out,
      op:nextType,
      n:nextN
    });

    beginStep();
  }

  function rowHTML(value, muted=true){
    const digits=String(value).split("");
    return `
      <div class="towerRow ${muted?"mutedRow":""}">
        <div class="numberWrap">
          ${digits.map(d=>`<div class="digitCol"><span class="digit">${d}</span></div>`).join("")}
        </div>
      </div>
    `;
  }

  function opHTML(op,n, extraClass=""){
    return `<div class="opCell ${extraClass}">${op ? `${op==="mul"?"×":"÷"} ${n}` : ""}</div>`;
  }

  function renderTower(){
    // Each value appears exactly once. Operations are rendered in a separate,
    // pinned rail on the right and never participate in horizontal scrolling.
    const visibleRows = completedRows.slice(-4);

    let html = visibleRows.map((r,i)=>{
      const isLast = i===visibleRows.length-1;
      return rowHTML(r.value,!isLast);
    }).join("");

    let opsHtml = visibleRows.map(r=>opHTML(r.op,r.n)).join("");

    const source = current.toString().split("");
    const extraLeading = task.type==="mul" ? 1 : 0;
    const cols = source.length + extraLeading;

    let resultHtml="";

    for(let c=0;c<cols;c++){
      let val="";
      let activeDigit=false;
      let carryHtml="";

      if(task.type==="mul"){
        if(c===0){
          val=task.finalCarry||"";
        }else{
          const di=c-1;
          val=task.result[di]||"";
          activeDigit=task.phase==="digit" && di===task.index;

          if(task.carries[di]!=="" && task.carries[di]!=="0"){
            carryHtml=`<span class="carry">${task.carries[di]}</span>`;
          }

          if(task.phase==="extra" && di===task.index){
            carryHtml=`<span class="carry active"></span>`;
          }
        }

        if(c===0 && task.finalCarry){
          carryHtml="";
        }

      }else{
        const di=c;
        val=task.result[di]||"";
        activeDigit=task.phase==="digit" && di===task.index;

        if(di>0){
          const written=task.remainders[di-1];
          if(written!=="" && written!=="0"){
            carryHtml=`<span class="carry">${written}</span>`;
          }
        }

        if(task.phase==="extra"){
          const targetDi=task.index+1;
          if(di===targetDi && targetDi<task.digits.length){
            carryHtml=`<span class="carry active"></span>`;
          }
        }
      }

      const isActiveColumn =
        activeDigit ||
        (
          task.phase==="extra" &&
          (
            (task.type==="mul" && (
              (c===0 && task.index===0) ||
              (c>0 && (c-1)===task.index)
            )) ||
            (task.type==="div" && c===task.index+1)
          )
        );

      resultHtml += `
        <div class="resultCell ${activeDigit?"active":""}" ${isActiveColumn ? 'data-scroll-anchor="1"' : ''}>
          ${carryHtml}
          <span class="digit">${val}</span>
        </div>
      `;
    }

    html += `
      <div class="rowRule"></div>
      <div class="towerRow resultRow currentRow">
        <div class="numberWrap">${resultHtml}</div>
      </div>
    `;

    // Matching fixed rail rows: one operation per value, then blank slots
    // for the rule and in-progress result row.
    opsHtml += `<div class="opRule"></div><div class="opCell resultOp"></div>`;

    tower.innerHTML=html;
    $("opsRail").innerHTML=opsHtml;

    const scroller = $("numberScroller");

    // For a new multiplication step, begin fully right-aligned.
    // Division starts from the leftmost digit, so center that active digit immediately.
    if(
      scroller &&
      task.phase==="digit" &&
      task.type==="mul" &&
      task.index===task.digits.length-1
    ){
      scroller.scrollLeft = scroller.scrollWidth - scroller.clientWidth;
    }

    keepCurrentVisible();

    if(task.phase==="digit"){
      if(task.type==="mul"){
        const d=task.digits[task.index];
        $("prompt").textContent=`${d} × ${task.n}${task.carryIn?` + ${task.carryIn}`:""}`;
      }else{
        $("prompt").textContent=task.remainderIn
          ? `${task.remainderIn}${task.digits[task.index]} ÷ ${task.n}`
          : `${task.digits[task.index]} ÷ ${task.n}`;
      }
    }else{
      $("prompt").textContent=task.type==="mul"?"Übertrag":"Rest";
    }
  }

  function keepCurrentVisible(){
    const scroller = $("numberScroller");
    if(!scroller) return;

    requestAnimationFrame(()=>{
      const anchor =
        tower.querySelector('[data-scroll-anchor="1"]') ||
        tower.querySelector(".resultCell.active");

      if(!anchor) return;

      const sr = scroller.getBoundingClientRect();
      const ar = anchor.getBoundingClientRect();

      const centerX = sr.left + sr.width * 0.5;
      const anchorCenter = ar.left + ar.width * 0.5;

      // Before the cursor reaches center: do absolutely nothing.
      // No movement and no faded edge.
      if(anchorCenter < centerX){
        const anchorContentCenter =
          anchor.offsetLeft + anchor.offsetWidth * 0.5;

        const target =
          anchorContentCenter - scroller.clientWidth * 0.5;

        const maxScroll = Math.max(
          0,
          scroller.scrollWidth - scroller.clientWidth
        );

        const nextLeft = Math.max(0, Math.min(target, maxScroll));

        if(Math.abs(nextLeft - scroller.scrollLeft) > 1){
          scroller.classList.add("hasScrolled");
          scroller.scrollTo({
            left: nextLeft,
            behavior: "smooth"
          });
        }
      }

      // Only enforce the right safety margin if we're already in scrolling mode.
      if(scroller.classList.contains("hasScrolled")){
        const updated = anchor.getBoundingClientRect();
        const rightLimit = sr.right - 24;

        if(updated.right > rightLimit){
          scroller.scrollTo({
            left: scroller.scrollLeft + (updated.right - rightLimit),
            behavior: "smooth"
          });
        }
      }
    });
  }

  function back(){
    if(mode==="seed"){
      seedText=seedText.slice(0,-1);
      renderSeed();
    }
  }

  function reset(){
    mode="seed";seedText="";seed=0n;current=0n;stepIndex=0;task=null;completedRows=[];
    $("progressFill").style.width="0%";
    $("startButton").classList.remove("hidden");
    show($("seedScreen"));
    renderSeed();
  }

  function processKey(k){
    if(k==="back"){
      if(mode==="seed") back();
    }else if(k==="action"){
      if(mode==="seed") randomSeed();
    }else{
      enterDigit(Number(k));
    }
  }

  // iOS haptic workaround:
  // each transparent native switch is the actual tap target.
  // WebKit generates the system switch haptic on direct touch.
  document.querySelectorAll(".key").forEach(btn=>{
    const sw = btn.querySelector(".hapticSwitch");
    if(!sw) return;

    sw.addEventListener("change", e=>{
      e.stopPropagation();

      // Toggle back on the next frame so the same switch can haptically
      // respond on every subsequent tap.
      const k = btn.dataset.key;
      processKey(k);

      requestAnimationFrame(()=>{
        sw.checked = false;
      });
    });

    // Prevent the underlying button click from double-firing.
    btn.addEventListener("click", e=>{
      if(e.target === sw) return;
      e.preventDefault();
    });
  });

  $("startButton").addEventListener("click",start);
  $("resetBtn").addEventListener("click",reset);

  window.addEventListener("keydown",e=>{
    if(/^[0-9]$/.test(e.key)) enterDigit(Number(e.key));
    else if(e.key==="Backspace") back();
    else if(e.key==="Enter" && mode==="seed") start();
  });

  renderSeed();
})();
</script>
</body>
</html>
