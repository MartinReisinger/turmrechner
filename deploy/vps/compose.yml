services:
  app:
    image: git.martindev.at/martinreisinger/turmrechner:${DEPLOY_COMMIT:?DEPLOY_COMMIT is required}
    restart: unless-stopped
    ports:
      - '127.0.0.1:3016:8080'
    environment:
      CONTACT_EMAIL: ${CONTACT_EMAIL:?Contact email is required}
    tmpfs:
      - /www/runtime:uid=65534,gid=65534,mode=0755,size=64k
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
